<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gabinet</title>
  <link rel="stylesheet" href="../root.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div id="header"></div>

  <main id="conteudo" class="page">
    <section class="hero">
      <h1 class="hero__title">Meu backlog</h1>
    </section>

    <section class="categories" aria-labelledby="categorias-titulo">
      <h2 id="categorias-titulo" class="categories__title">Categorias</h2>
      <ul id="category-list" class="category-list"></ul>
    </section>
  </main>

  <div id="footer"></div>

  <script type="module">
    import { Header } from "../components/header/header.js";
    import { Footer } from "../components/footer/footer.js";
    import { CategoryCard } from "../components/category-card/category-card.js";
    import { categories } from "../data/categories.js";

    document.getElementById("header").replaceWith(Header());

    const categoryList = document.getElementById("category-list");

    for (const { slug, name } of categories) {
      const item = document.createElement("li");
      item.append(CategoryCard({ slug, name }));
      categoryList.append(item);
    }

    document.getElementById("footer").replaceWith(Footer());
  </script>
</body>
</html>
